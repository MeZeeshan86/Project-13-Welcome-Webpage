apiVersion: apps/v1
kind: Deployment
metadata:
  name: welcome-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: welcome-web
  template:
    metadata:
      labels:
        app: welcome-web
    spec:
      containers:
      - name: welcome-web
        image: welcome-web:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: welcome-web-service
spec:
  type: NodePort
  selector:
    app: welcome-web
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30013
